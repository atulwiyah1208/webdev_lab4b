
<!DOCTYPE html>
<html>
<head>
    <title>Question 2- Number Validation</title>
</head>
<body>
    <h2>Number Validation</h2>

    <input type="text" id="userInput" placeholder="Enter a number">

    <button onclick="checkInput()">Check</button>

    <script>
        // user input
        function checkInput() {

            // value enter by user
            let input = document.getElementById("userInput").value;

            // convert input 
            let number = Number(input);

            // check input
            if (input.trim() === "" || isNaN(number)) {
                alert("Please insert a number!");
            }
            else if (number < 10) {
                alert("The number is lower than 10");
            }
            else if (number > 10) {
                alert("The number is higher than 10");
            }
            else {
                alert("The number is equal to 10");
            }
        }
    </script>
</body>
</html>
